<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<meta name="theme-color" content="#1F5A5A">
<title>連連看</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_shared/pms.css">
<style>
  .container { max-width: 900px; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 6px 0 14px; flex-wrap: wrap; }
  .top .stat { font-size: 18px; color: var(--ink-soft); }
  .top .stat b { color: var(--teal); font-family: var(--font-serif); font-size: 22px; }
  .lvl { display: flex; gap: 8px; }
  .lvl button { min-height: 48px; padding: 6px 16px; font-size: 17px; }
  .lvl button.sel { background: var(--teal); color: #fff; border-color: var(--teal); }
  .wrap { position: relative; width: 100%; max-width: 760px; margin: 0 auto; }
  #board { display: grid; gap: 8px; }
  .cell { aspect-ratio: 1; border-radius: 12px; border: 2px solid var(--border-strong); background: var(--paper); display: flex; align-items: center; justify-content: center; font-size: clamp(28px, 7vw, 52px); cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; transition: transform .15s, opacity .3s; }
  .cell.sel { border-color: var(--gold); background: var(--gold-tint); transform: scale(1.06); }
  .cell.gone { opacity: 0; pointer-events: none; }
  .cell.shake { animation: shake .3s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  svg.path { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .win { text-align: center; padding: 30px 10px; }
  .win h2 { font-family: var(--font-serif); font-size: 30px; color: var(--teal); margin-bottom: 8px; }
  .hintbtn { min-height: 48px; padding: 6px 16px; font-size: 17px; }
</style>
</head>
<body>
<div class="container">
  <div class="header" style="padding:10px 0 4px"><h1 style="font-size:28px">連連看</h1><p class="sub">點兩個一樣的圖案把它們消掉；兩個圖案之間要能用不超過兩個轉彎的直線連起來。</p></div>
  <div class="top">
    <div class="stat">剩下 <b id="left">0</b> 個</div>
    <div class="lvl">
      <button class="btn btn-ghost sel" data-l="easy" onclick="setLevel('easy')">簡單</button>
      <button class="btn btn-ghost" data-l="mid" onclick="setLevel('mid')">中等</button>
      <button class="btn btn-ghost" data-l="hard" onclick="setLevel('hard')">挑戰</button>
      <button class="btn btn-gold hintbtn" onclick="hint()">提示</button>
    </div>
  </div>
  <div class="wrap"><div id="board"></div><svg class="path" id="svg"></svg></div>
  <div id="win" class="win" style="display:none">
    <h2>全部消完了！</h2>
    <p class="muted" id="winMsg"></p>
    <div class="nav" style="justify-content:center"><button class="btn btn-primary btn-xl" onclick="start()">再玩一局</button></div>
  </div>
  <div class="nav"><a class="btn btn-ghost" href="index.html">← 遊戲選單</a><button class="btn btn-gold" onclick="start()">重新開始</button></div>
</div>
<script src="../_shared/config.js"></script>
<script src="../_shared/core.js"></script>
<script>
const { $, shuffle, funLogger } = COG;
const POOL = ['🍎','🍊','🍌','🍉','🍇','🍓','🥕','🌽','🌻','🌹','🌷','🍀','🐱','🐶','🐰','🐢','🐟','🦋','☀️','🌙','⭐','☂️','🎈','🎁','🚗','⛵','🏠','🔑'];
const LEVELS = { easy: { r: 4, c: 4, kinds: 4 }, mid: { r: 5, c: 6, kinds: 8 }, hard: { r: 6, c: 8, kinds: 12 } };
let level = 'easy', R, C, grid, sel = null, left = 0, t0 = 0;
const log = funLogger('連連看');
try { level = localStorage.getItem('fun-onet-level') || 'easy'; } catch (e) {}

function setLevel(l) { level = l; try { localStorage.setItem('fun-onet-level', l); } catch (e) {} document.querySelectorAll('.lvl button[data-l]').forEach(b => b.classList.toggle('sel', b.dataset.l === l)); start(); }
function start() {
  const L = LEVELS[level]; R = L.r; C = L.c;
  const n = R * C, kinds = shuffle(POOL.slice()).slice(0, L.kinds);
  const items = [];
  for (let i = 0; i < n / 2; i++) { const k = kinds[i % kinds.length]; items.push(k, k); }
  shuffle(items);
  // 外圍加一圈空格（R+2 × C+2），讓邊緣的圖案可以繞外面連
  grid = Array.from({ length: R + 2 }, () => Array(C + 2).fill(null));
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) grid[r + 1][c + 1] = items[r * C + c];
  left = n; sel = null; t0 = Date.now();
  $('left').textContent = left; $('win').style.display = 'none'; $('svg').innerHTML = '';
  const b = $('board'); b.style.display = 'grid'; b.style.gridTemplateColumns = `repeat(${C}, 1fr)`;
  let html = '';
  for (let r = 1; r <= R; r++) for (let c = 1; c <= C; c++) html += `<div class="cell" id="c${r}_${c}" onclick="tap(${r},${c})">${grid[r][c]}</div>`;
  b.innerHTML = html;
  if (!anyMove()) start();
}
function cell(r, c) { return $('c' + r + '_' + c); }
function lineClear(r1, c1, r2, c2) {   // 同列或同行、中間全空
  if (r1 === r2) { const [a, b] = [Math.min(c1, c2), Math.max(c1, c2)]; for (let c = a + 1; c < b; c++) if (grid[r1][c]) return false; return true; }
  if (c1 === c2) { const [a, b] = [Math.min(r1, r2), Math.max(r1, r2)]; for (let r = a + 1; r < b; r++) if (grid[r][c1]) return false; return true; }
  return false;
}
function findPath(r1, c1, r2, c2) {   // 回傳折點路徑（含起終點），最多兩個轉彎
  if (lineClear(r1, c1, r2, c2)) return [[r1, c1], [r2, c2]];
  // 一個轉彎
  for (const [rm, cm] of [[r1, c2], [r2, c1]]) if (!grid[rm][cm] && lineClear(r1, c1, rm, cm) && lineClear(rm, cm, r2, c2)) return [[r1, c1], [rm, cm], [r2, c2]];
  // 兩個轉彎：沿第一點的列或行掃
  for (let c = 0; c < C + 2; c++) if (c !== c1 && !grid[r1][c] && lineClear(r1, c1, r1, c) && !grid[r2][c] && lineClear(r1, c, r2, c) && lineClear(r2, c, r2, c2)) return [[r1, c1], [r1, c], [r2, c], [r2, c2]];
  for (let r = 0; r < R + 2; r++) if (r !== r1 && !grid[r][c1] && lineClear(r1, c1, r, c1) && !grid[r][c2] && lineClear(r, c1, r, c2) && lineClear(r, c2, r2, c2)) return [[r1, c1], [r, c1], [r, c2], [r2, c2]];
  return null;
}
function tap(r, c) {
  if (!grid[r][c]) return;
  const el = cell(r, c);
  if (sel && sel[0] === r && sel[1] === c) { el.classList.remove('sel'); sel = null; return; }
  if (!sel) { sel = [r, c]; el.classList.add('sel'); return; }
  const [r1, c1] = sel;
  if (grid[r1][c1] === grid[r][c]) {
    const path = findPath(r1, c1, r, c);
    if (path) { drawPath(path); clear(r1, c1); clear(r, c); sel = null; return; }
  }
  el.classList.add('shake'); setTimeout(() => el.classList.remove('shake'), 300);
  cell(r1, c1).classList.remove('sel'); sel = [r, c]; el.classList.add('sel');
}
function clear(r, c) {
  grid[r][c] = null; const el = cell(r, c); el.classList.remove('sel'); el.classList.add('gone');
  left--; $('left').textContent = left;
  if (left === 0) return win();
  if (!anyMove()) reshuffle();
}
function drawPath(path) {
  const b = $('board'), rect = b.getBoundingClientRect(), cw = rect.width / C, ch = rect.height / R;
  const pts = path.map(([r, c]) => ((c - 1) * cw + cw / 2) + ',' + ((r - 1) * ch + ch / 2)).join(' ');
  $('svg').setAttribute('viewBox', `0 0 ${rect.width} ${rect.height}`);
  $('svg').innerHTML = `<polyline points="${pts}" fill="none" stroke="#A87B4D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`;
  setTimeout(() => { $('svg').innerHTML = ''; }, 450);
}
function allPairs() {
  const list = [];
  for (let r1 = 1; r1 <= R; r1++) for (let c1 = 1; c1 <= C; c1++) { if (!grid[r1][c1]) continue;
    for (let r2 = 1; r2 <= R; r2++) for (let c2 = 1; c2 <= C; c2++) { if ((r2 * 100 + c2) <= (r1 * 100 + c1) || grid[r2][c2] !== grid[r1][c1]) continue; if (findPath(r1, c1, r2, c2)) list.push([r1, c1, r2, c2]); } }
  return list;
}
function anyMove() { return allPairs().length > 0; }
function reshuffle() {   // 無路可走：把剩下的圖案重排
  const rest = [];
  for (let r = 1; r <= R; r++) for (let c = 1; c <= C; c++) if (grid[r][c]) rest.push(grid[r][c]);
  let tries = 0;
  do { shuffle(rest); let i = 0; for (let r = 1; r <= R; r++) for (let c = 1; c <= C; c++) if (grid[r][c]) { grid[r][c] = rest[i++]; cell(r, c).textContent = grid[r][c]; } } while (!anyMove() && ++tries < 50);
}
function hint() {
  const p = allPairs(); if (!p.length) return;
  const [r1, c1, r2, c2] = p[Math.floor(Math.random() * p.length)];
  [cell(r1, c1), cell(r2, c2)].forEach(el => { el.classList.add('sel'); setTimeout(() => { if (!(sel && cell(sel[0], sel[1]) === el)) el.classList.remove('sel'); }, 1200); });
}
function win() { log.round(); $('board').style.display = 'none'; $('winMsg').textContent = '用時 ' + COG.fmtTime((Date.now() - t0) / 1000) + '。'; $('win').style.display = 'block'; }
document.querySelectorAll('.lvl button[data-l]').forEach(b => b.classList.toggle('sel', b.dataset.l === level));
start();
</script>
</body>
</html>
