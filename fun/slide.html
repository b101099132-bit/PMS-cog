<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<title>數字排排站</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_shared/pms.css">
<style>
  .container { max-width: 760px; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 6px 0 14px; }
  .top .stat { font-size: 18px; color: var(--ink-soft); }
  .top .stat b { color: var(--teal); font-family: var(--font-serif); font-size: 22px; }
  .lvl { display: flex; gap: 8px; }
  .lvl button { min-height: 48px; padding: 6px 16px; font-size: 17px; }
  .lvl button.sel { background: var(--teal); color: #fff; border-color: var(--teal); }
  #board { display: grid; gap: 10px; width: min(92vw, 520px); margin: 0 auto; background: var(--teal-soft); padding: 10px; border-radius: 16px; }
  .t { aspect-ratio: 1; border-radius: 12px; background: var(--paper); border: 2px solid var(--border-strong); display: flex; align-items: center; justify-content: center; font-family: var(--font-serif); font-size: clamp(32px, 9vw, 60px); font-weight: 600; color: var(--teal); cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; transition: transform .12s; }
  .t.empty { background: transparent; border-color: transparent; cursor: default; }
  .t.ok { color: var(--success); border-color: #CFE0D4; }
  .t.can:active { transform: scale(.95); }
  .goal { text-align: center; font-size: 16px; color: var(--ink-faint); margin-top: 12px; }
  .win { text-align: center; padding: 30px 10px; }
  .win h2 { font-family: var(--font-serif); font-size: 30px; color: var(--teal); margin-bottom: 8px; }
</style>
</head>
<body>
<div class="container">
  <div class="header" style="padding:10px 0 4px"><h1 style="font-size:28px">數字排排站</h1><p class="sub">點空格旁邊的數字把它滑過去，把 1、2、3… 排回順序，空格留在右下角。</p></div>
  <div class="top">
    <div class="stat">移動 <b id="moves">0</b> 步</div>
    <div class="lvl">
      <button class="btn btn-ghost sel" data-l="3" onclick="setLevel(3)">3×3</button>
      <button class="btn btn-ghost" data-l="4" onclick="setLevel(4)">4×4</button>
    </div>
  </div>
  <div id="board"></div>
  <div class="goal">變綠色表示那個數字已經在正確位置</div>
  <div id="win" class="win" style="display:none">
    <h2>排好了！</h2>
    <p class="muted" id="winMsg"></p>
    <div class="nav" style="justify-content:center"><button class="btn btn-primary btn-xl" onclick="start()">再玩一局</button></div>
  </div>
  <div class="nav"><a class="btn btn-ghost" href="index.html">← 遊戲選單</a><button class="btn btn-gold" onclick="start()">重新開始</button></div>
</div>
<script src="../_shared/config.js"></script>
<script src="../_shared/core.js"></script>
<script>
const { $, funLogger } = COG;
let N = 3, tiles = [], moves = 0, t0 = 0;
const log = funLogger('數字排排站');
try { N = parseInt(localStorage.getItem('fun-slide-n')) || 3; } catch (e) {}

function setLevel(n) { N = n; try { localStorage.setItem('fun-slide-n', n); } catch (e) {} document.querySelectorAll('.lvl button').forEach(b => b.classList.toggle('sel', +b.dataset.l === n)); start(); }
function start() {
  // 從完成狀態隨機走若干步打亂，保證一定可解、且不會太難
  tiles = Array.from({ length: N * N }, (_, i) => (i + 1) % (N * N));
  let empty = N * N - 1, last = -1;
  const steps = N === 3 ? 40 : 90;
  for (let s = 0; s < steps; s++) {
    const nb = neighbors(empty).filter(i => i !== last);
    const pick = nb[Math.floor(Math.random() * nb.length)];
    [tiles[empty], tiles[pick]] = [tiles[pick], tiles[empty]]; last = empty; empty = pick;
  }
  if (solved()) return start();
  moves = 0; t0 = Date.now(); $('moves').textContent = 0; $('win').style.display = 'none'; $('board').style.display = 'grid';
  render();
}
function neighbors(i) { const r = Math.floor(i / N), c = i % N, out = []; if (r > 0) out.push(i - N); if (r < N - 1) out.push(i + N); if (c > 0) out.push(i - 1); if (c < N - 1) out.push(i + 1); return out; }
function solved() { return tiles.every((v, i) => v === (i + 1) % (N * N)); }
function render() {
  const empty = tiles.indexOf(0), can = neighbors(empty);
  const b = $('board'); b.style.gridTemplateColumns = `repeat(${N}, 1fr)`;
  b.innerHTML = tiles.map((v, i) => v === 0 ? `<div class="t empty"></div>` : `<div class="t ${v === i + 1 ? 'ok' : ''} ${can.includes(i) ? 'can' : ''}" onclick="tap(${i})">${v}</div>`).join('');
}
function tap(i) {
  const empty = tiles.indexOf(0);
  // 允許點同一列／行上隔著幾格的數字，一次推過去（對長者比較直覺）
  const r = Math.floor(i / N), c = i % N, er = Math.floor(empty / N), ec = empty % N;
  if (r !== er && c !== ec) return;
  const step = r === er ? (i < empty ? 1 : -1) : (i < empty ? N : -N);
  let e = empty;
  while (e !== i) { tiles[e] = tiles[e - step]; e -= step; }
  tiles[i] = 0; moves++; $('moves').textContent = moves; render();
  if (solved()) { log.round(); $('board').style.display = 'none'; $('winMsg').textContent = '共 ' + moves + ' 步，用時 ' + COG.fmtTime((Date.now() - t0) / 1000) + '。'; $('win').style.display = 'block'; }
}
document.querySelectorAll('.lvl button').forEach(b => b.classList.toggle('sel', +b.dataset.l === N));
start();
</script>
</body>
</html>
